# GCP Marketplace Configuration

# Enable operator deployment (via subchart)
operator:
  enabled: true

# Enable objectstore deployment (via custom template)
objectstore:
  enabled: true

  # MinIO AIStor image
  image:
    repository: quay.io/minio/aistor/minio
    tag: RELEASE.2025-12-20T04-58-37Z
    pullPolicy: IfNotPresent

  # Storage pools configuration (servers=1 and name=pool-0 are hardcoded in template)
  pools:
    "0":
      volumesPerServer: 4
      size: 10Gi

      resources:
        requests:
          memory: 2Gi
          cpu: 1000m

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true

      containerSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

  mountPath: /export
  subPath: /data

# GCP Marketplace specific settings
serviceAccount: ""

# GCP Marketplace Reporting Secret (for usage-based billing)
# This is automatically set by GCP Marketplace deployer
reportingSecret: ""

# Usage-based billing configuration
billing:
  serviceName: "aistor.endpoints.minio-inc-public.cloud.goog"
  metricName: "minio_usage"
  minimumGiB: 1024
  # Hour (UTC) when daily usage report runs (0-23, default: 1 = 1 AM UTC)
  reportHour: 1

# MinIO root credentials
secrets:
  accessKey: admin
  secretKey: ""

# Configuration for aistor-operator subchart (v5.2.1 - supports FREE plan)
aistor-operator:
  license: ""
  global:
    operator:
      replicas: 1
      resources:
        requests:
          cpu: 500m
          memory: 256Mi
      # Disable autocert to avoid GKE Autopilot CSR restrictions
      # Note: value must be "on" to disable (counterintuitive code logic)
      extraEnv:
        - name: OPERATOR_AUTO_CERT_DISABLED
          value: "on"

  operators:
    adminjob:
      disabled: false
    object-store:
      disabled: false
