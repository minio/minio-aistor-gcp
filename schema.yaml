x-google-marketplace:
  schemaVersion: v2
  applicationApiVersion: v1beta1
  publishedVersion: '1.0.0'
  publishedVersionMetadata:
    releaseNote: >-
      Simplified deployment configuration with streamlined parameters focusing on essential settings.
      Updated to latest GCP Marketplace base image (0.12.10) for Kubernetes 1.33+ compatibility.
      BYOL (Bring Your Own License) - MinIO AIStor is licensed directly through MinIO.
    releaseTypes:
      - Feature
    recommended: true

  # Deployer service account permissions
  # The deployer needs cluster-scoped permissions to create CRDs and ClusterRoles
  # during the initial deployment of the MinIO AIStor Operator
  deployerServiceAccount:
    description: >
      Creates cluster-scoped resources required by MinIO AIStor Operator,
      including CustomResourceDefinitions for ObjectStore management and
      ClusterRoles for operator permissions.
    roles:
    - type: ClusterRole
      rulesType: CUSTOM
      rules:
      # CRD management - required to install operator CRDs
      - apiGroups: ['apiextensions.k8s.io']
        resources: ['customresourcedefinitions']
        verbs: ['get', 'list', 'create', 'update', 'patch']
      # ClusterRole management - required for operator RBAC setup
      # Including 'bind' and 'escalate' to allow creating roles with any permissions
      - apiGroups: ['rbac.authorization.k8s.io']
        resources: ['clusterroles', 'clusterrolebindings', 'roles', 'rolebindings']
        verbs: ['get', 'list', 'create', 'update', 'patch', 'bind', 'escalate']
      # Permissions for resources that operator ClusterRoles will manage
      - apiGroups: ['']
        resources: ['*']
        verbs: ['*']
      - apiGroups: ['apps']
        resources: ['*']
        verbs: ['*']
      - apiGroups: ['aistor.min.io']
        resources: ['*']
        verbs: ['*']
      - apiGroups: ['authentication.k8s.io']
        resources: ['tokenreviews']
        verbs: ['create']

  # Image declarations
  images:
    deployer:
      properties:
        deployer.image:
          type: FULL

  # Cluster constraints
  clusterConstraints:
    resources:
    - replicas: 4
      requests:
        cpu: 1000m
        memory: 2Gi
      affinity:
        simpleNodeAffinity:
          type: REQUIRE_ONE_NODE_PER_REPLICA

properties:
  name:
    type: string
    x-google-marketplace:
      type: NAME
    title: Application name
    description: The name of the MinIO AIStor application instance
    default: minio-aistor

  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE
    title: Namespace
    description: The Kubernetes namespace where MinIO AIStor will be deployed

  # MinIO AIStor License (REQUIRED)
  license:
    type: string
    title: AIStor License Key
    description: |
      MinIO AIStor Enterprise license key (JWT format, starts with 'eyJ').
      Contact MinIO for a license: https://min.io/contact
      IMPORTANT: Use the decoded JWT token, not the base64-encoded block.
    default: "REPLACE_WITH_YOUR_MINIO_LICENSE"
    x-google-marketplace:
      type: STRING

  # Object Store Configuration
  aistor-objectstore.objectStore.pools.0.servers:
    type: integer
    title: Number of servers
    description: |
      Number of MinIO server replicas to deploy.
      Minimum 4 for distributed mode (recommended for production).
    default: 4
    minimum: 4
    maximum: 32

  aistor-objectstore.objectStore.pools.0.name:
    type: string
    title: Pool name
    description: Internal name for the storage pool (used by MinIO for pool identification)
    default: pool-0
    x-google-marketplace:
      type: STRING

  aistor-objectstore.objectStore.pools.0.volumesPerServer:
    type: integer
    title: Volumes per server
    description: Number of storage volumes attached to each MinIO server
    default: 4
    minimum: 1
    maximum: 16

  aistor-objectstore.objectStore.pools.0.size:
    type: string
    title: Storage size per volume
    description: Size of persistent volume for each volume attachment (e.g., 10Gi, 100Gi, 1Ti)
    default: 10Gi
    pattern: '^[1-9][0-9]*(\.[0-9]+)?[GT]i$'

  # Root Credentials
  aistor-objectstore.secrets.accessKey:
    type: string
    title: Root access key
    description: MinIO root access key (username)
    default: admin

  aistor-objectstore.secrets.secretKey:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 32
        includeSymbols: false
        base64: false
    title: Root secret key
    description: MinIO root secret key (password) - auto-generated if not provided

  # Service Account
  serviceAccount:
    type: string
    title: Service account
    x-google-marketplace:
      type: SERVICE_ACCOUNT
      serviceAccount:
        description: Service account for MinIO AIStor Operator and Object Store
        roles:
        - type: ClusterRole
          rulesType: CUSTOM
          rules:
          # Operator permissions
          - apiGroups: [""]
            resources: ["persistentvolumeclaims", "services", "pods", "secrets", "configmaps", "serviceaccounts"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["apps"]
            resources: ["statefulsets", "deployments"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: [""]
            resources: ["events"]
            verbs: ["create", "patch"]
          - apiGroups: ["aistor.min.io"]
            resources: ["objectstores", "objectstores/status", "objectstores/finalizers"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["rbac.authorization.k8s.io"]
            resources: ["rolebindings", "roles", "clusterroles", "clusterrolebindings"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["apiextensions.k8s.io"]
            resources: ["customresourcedefinitions"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

required:
- name
- namespace
- license
- aistor-objectstore.objectStore.pools.0.servers
- aistor-objectstore.objectStore.pools.0.name
- aistor-objectstore.objectStore.pools.0.volumesPerServer
- aistor-objectstore.objectStore.pools.0.size
- aistor-objectstore.secrets.accessKey
- aistor-objectstore.secrets.secretKey
- serviceAccount
