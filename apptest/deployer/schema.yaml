x-google-marketplace:
  schemaVersion: v2
  applicationApiVersion: v1beta1
  publishedVersion: '1.0.5'
  publishedVersionMetadata:
    releaseNote: >-
      Initial release of MinIO AIStor on GCP Marketplace.
      Includes operator-based deployment for enterprise-grade object storage.
    releaseTypes:
      - Feature
    recommended: true

  # Image declarations
  images:
    deployer:
      properties:
        deployer.image:
          type: FULL

  # Cluster constraints
  clusterConstraints:
    resources:
    - replicas: 4
      requests:
        cpu: 1000m
        memory: 2Gi
      affinity:
        simpleNodeAffinity:
          type: REQUIRE_ONE_NODE_PER_REPLICA

properties:
  name:
    type: string
    x-google-marketplace:
      type: NAME
    default: minio-aistor-test

  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE
    default: minio-aistor-test

  license:
    type: string
    default: "TEST_LICENSE_KEY"

  aistor-objectstore.objectStore.pools.0.servers:
    type: integer
    default: 4

  aistor-objectstore.objectStore.pools.0.volumesPerServer:
    type: integer
    default: 1

  aistor-objectstore.objectStore.pools.0.size:
    type: string
    default: 10Gi

  aistor-objectstore.secrets.accessKey:
    type: string
    default: admin

  aistor-objectstore.secrets.secretKey:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 16

  serviceAccount:
    type: string
    x-google-marketplace:
      type: SERVICE_ACCOUNT
      serviceAccount:
        roles:
        - type: ClusterRole
          rulesType: CUSTOM
          rules:
          - apiGroups: [""]
            resources: ["persistentvolumeclaims", "services", "pods", "secrets", "configmaps", "serviceaccounts"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["apps"]
            resources: ["statefulsets", "deployments"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["aistor.min.io"]
            resources: ["objectstores", "objectstores/status", "objectstores/finalizers"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

required:
- name
- namespace
- license
- aistor-objectstore.objectStore.pools.0.servers
- serviceAccount
